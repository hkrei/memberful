<style>
/* Layout: Memberful's centered single-column steps; integrations step opens into a two-panel card (list left, live preview right). */
:root{
  --bg:#ffffff; --ground:#fafafa; --surface:#ffffff; --fg:#1d1d20; --muted:#5c5c63; --faint:#8a8a92;
  --line:#c8c8cd; --line-soft:#e6e6ea; --accent:#0073ea; --accent-ink:#ffffff; --accent-soft:#e9f2fe; --accent-off:#8fbaf3;
  --ok:#1f8a4c; --ok-soft:#e6f5ec; --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  --serif:"Newsreader","Iowan Old Style",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151518; --ground:#111114; --surface:#1c1c20; --fg:#ececef; --muted:#a6a6ae; --faint:#7d7d86;
  --line:#3d3d44; --line-soft:#2a2a30; --accent:#3d93f5; --accent-ink:#ffffff; --accent-soft:#16263b; --accent-off:#2a4a73;
  --ok:#4cc27e; --ok-soft:#173225; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151518; --ground:#111114; --surface:#1c1c20; --fg:#ececef; --muted:#a6a6ae; --faint:#7d7d86;
  --line:#3d3d44; --line-soft:#2a2a30; --accent:#3d93f5; --accent-ink:#ffffff; --accent-soft:#16263b; --accent-off:#2a4a73;
  --ok:#4cc27e; --ok-soft:#173225; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.ground{background:var(--ground)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wordmark{font-family:var(--sans);font-weight:600;letter-spacing:.24em;font-size:15px;text-transform:uppercase;display:inline-flex;align-items:center;gap:2px}
.wordmark i{font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px;letter-spacing:0;margin-right:1px;line-height:1}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line-soft);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{justify-self:start;background:none;border:0;padding:8px;margin-left:-8px;cursor:pointer;border-radius:8px;display:flex}
.back:hover{background:var(--line-soft)}
.dots{justify-self:end;display:flex;gap:9px}
.dots span{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--fg);opacity:.75}
.dots span.on{background:var(--fg)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 120px}
.col{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.narrow{max-width:420px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.4vw,44px);line-height:1.12;letter-spacing:-.01em;text-align:center;margin:0;text-wrap:balance}
.sub{color:var(--muted);text-align:center;margin:-14px 0 0;text-wrap:balance}

/* signup */
.signup-head{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:40px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field label b{color:#d93a3a;font-weight:500}
.input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:13px;color:var(--faint)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check a{color:var(--fg)}
.form{display:flex;flex-direction:column;gap:18px}
.signin{text-align:center;font-size:14px;color:var(--muted)}
.signin a{color:var(--accent);text-decoration:none;font-weight:500}

.btn{height:50px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer;width:100%;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{background:var(--accent-off);cursor:not-allowed}
.btn.inline{width:auto;padding:0 28px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

/* segment cards */
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:grid;grid-template-columns:40px 1fr 22px;gap:16px;align-items:center;text-align:left;cursor:pointer;
  border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 20px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--faint)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--ground);border:1px solid var(--line-soft);color:var(--fg)}
.opt[aria-checked="true"] .ic{color:var(--accent);border-color:transparent;background:var(--surface)}
.opt .t{font-weight:500;font-size:16px;line-height:1.35}
.opt .d{color:var(--muted);font-size:14px;margin-top:3px}
.opt[aria-checked="true"] .t{color:var(--accent)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--accent)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt-other{font-size:14px;color:var(--muted);text-align:center}
.opt-other button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

/* integrations */
.wide{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line-soft);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-height:600px}
.plist{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line-soft)}
.ptop{padding:22px 22px 12px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:40px;height:44px;font-size:15px}
.scroll{overflow-y:auto;max-height:470px;padding:0 12px 16px}
.group{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;display:flex;justify-content:space-between;gap:8px}
.group em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--accent)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.row:hover{background:var(--ground)}
.logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex:none}
.row .n{font-weight:500}
.row .c{font-size:13px;color:var(--muted)}
.add{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.row:hover .add{background:var(--line-soft);color:var(--fg)}
.done{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;vertical-align:1px}
.empty{padding:24px 10px;color:var(--muted);font-size:14px}

.pvis{position:relative;background:var(--ground);overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0}
.cloud{position:absolute;inset:0;padding:22px;display:flex;flex-wrap:wrap;gap:8px;align-content:center;justify-content:center;
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 26%,#000 62%);mask-image:radial-gradient(ellipse at center,transparent 26%,#000 62%)}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-soft);background:var(--surface);color:var(--faint);white-space:nowrap;transition:color .4s,border-color .4s}
.chip.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.orbit{position:relative;width:300px;height:300px;max-width:90%}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:24px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-family:var(--serif);font-style:italic;font-size:52px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.sat{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--surface);border:1px solid var(--line-soft);display:grid;place-items:center;
  box-shadow:var(--shadow);animation:pop .35s ease-out both}
.sat .logo{width:32px;height:32px;border-radius:8px;font-size:12px}
.sat.ghost{border-style:dashed;background:transparent;box-shadow:none;color:var(--faint);animation:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line-soft);margin-top:auto}
.pfoot .meta{font-size:14px;color:var(--muted)}
.pfoot .btn{height:44px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,15,20,.42);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;animation:pop .2s ease-out}
.mhead{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:22px 22px 6px}
.mhead .logo{width:52px;height:52px;border-radius:12px;font-size:19px}
.mhead h2{margin:0;font-size:18px;font-weight:600}
.mhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;align-self:start}
.x:hover{background:var(--line-soft)}
.mbody{padding:12px 22px 22px;display:flex;flex-direction:column;gap:18px}
.mbody h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.mbody ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.mbody li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:15px}
.mbody li svg{color:var(--ok);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.mfoot{padding:14px 22px;border-top:1px solid var(--line-soft);background:var(--ground)}
.mfoot .btn{height:46px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ok-soft);color:var(--ok);
  border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);animation:pop .2s ease-out}

/* ready */
.ready{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px;align-items:stretch}
.steps{border:1px solid var(--line-soft);border-radius:14px;background:var(--surface);overflow:hidden}
.steps .sh{padding:14px 18px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.step:last-child{border-bottom:0}
.step .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.ok .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step .st{font-weight:500}
.step .sd{font-size:13px;color:var(--muted)}
.step .go{font-size:14px;color:var(--accent);font-weight:500}
.step.ok .go{color:var(--ok)}
.connected{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-soft);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;background:var(--surface)}
.pill .logo{width:24px;height:24px;border-radius:50%;font-size:10px}
.support{text-align:center;color:var(--muted);font-size:14px}
.center{display:flex;justify-content:center}

/* prototype bar */
.proto{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--fg) 92%,transparent);color:var(--bg);
  display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:13px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.proto .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.7}
.proto nav{display:flex;gap:4px;flex-wrap:wrap}
.proto button{background:transparent;border:0;color:inherit;padding:5px 10px;border-radius:6px;cursor:pointer;opacity:.75;font-size:13px}
.proto button:hover{opacity:1;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.proto button.cur{opacity:1;background:color-mix(in srgb,var(--bg) 20%,transparent)}
.proto .sp{flex:1}

@media (max-width:820px){
  .panel{grid-template-columns:1fr;min-height:0}
  .pvis{display:none}
  .plist{border-right:0}
  .scroll{max-height:none}
}
@media (max-width:520px){
  main{padding-block:32px 140px}
  .opt{grid-template-columns:1fr 22px;padding:16px}
  .opt .ic{display:none}
  .dots span{width:7px;height:7px}
  .wordmark{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    act:['Add subscribers','Tag by plan','Update status','Unsubscribe']},
  kit:{name:'Kit',cat:'Email',bg:'#ff5a5f',l:'K',desc:'Sync members with your newsletter',
    ex:['Tag subscribers when they become members','Send paid-only issues','Upsell free subscribers to a paid plan'],
    act:['Add subscribers','Apply tags','Remove tags','Sync plans']},
  mailerlite:{name:'MailerLite',cat:'Email',bg:'#09c269',l:'ML',desc:'Sync members with your email groups',
    ex:['Add members to groups by plan','Move cancelled members to a win-back group'],act:['Add to group','Remove from group']},
  klaviyo:{name:'Klaviyo',cat:'Email',bg:'#232426',l:'K',desc:'Use membership data in your flows',
    ex:['Trigger flows when someone joins or cancels','Segment by plan and renewal date'],act:['Track events','Update profiles','Segment by plan']},
  wordpress:{name:'WordPress',cat:'Website',bg:'#21759b',l:'W',desc:'Gate content on your WordPress site',
    ex:['Restrict posts and pages to members','Show sign-up and account links in your menu','Hide ads for paying members'],
    act:['Restrict content','Hide ads','Sign-in links','Member menus']},
  squarespace:{name:'Squarespace',cat:'Website',bg:'#2b2b2b',l:'Sq',desc:'Add sign-up and members-only pages',
    ex:['Add a sign-up button to any page','Protect members-only pages'],act:['Sign-up buttons','Protect pages']},
  wix:{name:'Wix',cat:'Website',bg:'#0c6efc',l:'Wx',desc:'Add sign-up and members-only pages',
    ex:['Add a sign-up button to any page','Link members to their account'],act:['Sign-up buttons','Account links']},
  podcast:{name:'Private podcast',cat:'Podcasts',bg:'#8e44ad',l:'P',desc:'Give members their own feed',
    ex:['Each member gets a private feed for any podcast app','Access ends when a subscription ends'],act:['Private feeds','Bonus episodes','Revoke access']},
  applepod:{name:'Apple Podcasts',cat:'Podcasts',bg:'#9933cc',l:'AP',desc:'Members listen in the app they already use',
    ex:['Members add their private feed in one tap','Paid episodes show up next to your free show'],act:['One-tap subscribe','Paid episodes']},
  learndash:{name:'LearnDash',cat:'Online learning',bg:'#2c3e8f',l:'LD',desc:'Give members access to your courses',
    ex:['Enroll members in courses based on their plan','Remove course access when a subscription ends'],act:['Enroll in courses','Unenroll','Course access by plan']},
  lifterlms:{name:'LifterLMS',cat:'Online learning',bg:'#466dd8',l:'L',desc:'Sell course access through memberships',
    ex:['Unlock courses and lessons for paying members','Bundle courses into membership tiers'],act:['Unlock courses','Bundle by tier']}
};

const S = {screen:'signup', name:'', email:'', pw:'', terms:false, seg:null, other:'', connected:[], q:'', modal:null, connecting:false};
const ORDER = ['signup','segment','integrations'];
const LABEL = {signup:'1 Sign up',segment:'2 About you',integrations:'3 Integrations'};
const segValid = () => S.seg && (S.seg!=='other' || S.other.trim().length>=3);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo = (id,cls='logo') => `<span class="${cls}" style="background:${APPS[id].bg}" aria-hidden="true">${APPS[id].l}</span>`;
const seg = () => SEGMENTS.find(s=>s.id===S.seg) || OTHER;

function go(screen){ S.screen=screen; S.modal=null; try{history.replaceState(null,'','#'+screen)}catch(e){} render(); window.scrollTo(0,0); }

function topbar(stepIdx){
  const dots = [0,1].map(i=>`<span class="${i<=stepIdx?'on':''}"></span>`).join('');
  return `<header class="topbar"><button class="back" type="button" data-back aria-label="Back">${ICON.back}</button>
    <span class="wordmark"><i>M</i>emberful</span><div class="dots" aria-label="Step ${stepIdx+1} of 2">${dots}</div></header>`;
}

function vSignup(){
  const ok = S.name.trim() && /\S+@\S+\.\S+/.test(S.email) && S.pw.length>=8 && S.terms;
  return `<main><div class="col narrow">
    <div class="signup-head"><span class="wordmark"><i>M</i>emberful</span><h1>Get started for free</h1></div>
    <p class="sub">No card required.</p>
    <form class="form" id="f-signup" novalidate>
      <div class="field"><label for="name">Full name<b>*</b></label><input class="input" id="name" autocomplete="name" value="${esc(S.name)}"></div>
      <div class="field"><label for="email">Email<b>*</b></label><input class="input" id="email" type="email" autocomplete="email" value="${esc(S.email)}"></div>
      <div class="field"><label for="pw">Password<b>*</b></label><input class="input" id="pw" type="password" autocomplete="new-password" value="${esc(S.pw)}"><span class="hint">At least 8 characters</span></div>
      <label class="check"><input type="checkbox" id="terms" ${S.terms?'checked':''}> <span>I agree to the <a href="#signup">Terms of Service</a> &amp; <a href="#signup">Privacy Policy</a>.</span></label>
      <button class="btn" id="go-signup" type="submit" ${ok?'':'disabled'}>Continue</button>
      <p class="signin">Already have an account? <a href="#signup">Sign in</a></p>
    </form></div></main>`;
}

function vSegment(){
  const first = (S.name.trim().split(/\s+/)[0]) || 'there';
  const opts = SEGMENTS.map(s=>`<button type="button" class="opt" role="radio" aria-checked="${S.seg===s.id}" data-seg="${s.id}">
      <span class="ic">${ICON[s.icon]}</span><span><div class="t">${s.t}</div><div class="d">${s.d}</div></span><span class="radio"></span></button>`).join('');
  return topbar(0)+`<main><div class="col">
    <h1>Welcome, ${esc(first)}. Which of these best describes you right now?</h1>
    <p class="sub">We’ll set up Memberful around what you’re trying to do.</p>
    <div class="opts" role="radiogroup" aria-label="What describes you">${opts}
      <button type="button" class="opt" role="radio" aria-checked="${S.seg==='other'}" data-seg="other">
        <span class="ic">${ICON.plus}</span><span><div class="t">Something else</div><div class="d">Tell us in a few words what you’re trying to do.</div></span><span class="radio"></span></button>
      <div class="field" ${S.seg==='other'?'':'hidden'}><label for="other">What are you hoping to do with Memberful?<b>*</b></label>
        <input class="input" id="other" maxlength="140" placeholder="e.g. Sell access to a members-only course library" value="${esc(S.other)}"></div>
    </div>
    <button class="btn" id="go-seg" type="button" ${segValid()?'':'disabled'}>Continue</button>
  </div></main>`;
}

function vIntegrations(){
  const s = seg();
  const q = S.q.trim().toLowerCase();
  const match = id => !q || (APPS[id].name+' '+APPS[id].cat).toLowerCase().includes(q);
  const row = id => {
    const c = S.connected.includes(id), r = s.rec.includes(id);
    return `<button type="button" class="row" data-app="${id}">${logo(id)}<span><div class="n">${APPS[id].name}${r&&!c?' <span class="badge">Recommended</span>':''}</div><div class="c">${c?'Connected':APPS[id].desc}</div></span>
      ${c?`<span class="done" aria-label="Connected">${ICON.check}</span>`:`<span class="add" aria-label="Add">${ICON.plus}</span>`}</button>`;
  };
  let list = '';
  CATS.forEach(cat=>{
    const ids = Object.keys(APPS).filter(id=>APPS[id].cat===cat && match(id))
      .sort((a,b)=>(s.rec.includes(b)-s.rec.includes(a)));
    if(ids.length) list += `<div class="group">${cat}</div>`+ids.map(row).join('');
  });
  if(!list) list = `<div class="empty">No integrations match “${esc(S.q)}”. Try a category like Email or Community.</div>`;

  const shown = S.connected.length ? S.connected : [];
  const ghosts = Math.max(0, 3 - shown.length);
  const items = shown.map(id=>({id})).concat(Array.from({length:ghosts},()=>({ghost:true}))).slice(0,8);
  const sats = items.map((it,i)=>{
    const a = (-90 + i*360/items.length)*Math.PI/180, r=42;
    const st = `left:${50+r*Math.cos(a)}%;top:${50+r*Math.sin(a)}%`;
    return it.ghost ? `<span class="sat ghost" style="${st}">${ICON.plus}</span>` : `<span class="sat" style="${st}">${logo(it.id)}</span>`;
  }).join('');
  const liveActs = new Set(S.connected.flatMap(id=>APPS[id].act));
  const allActs = [...new Set(Object.values(APPS).flatMap(a=>a.act))];
  const cloud = allActs.concat(allActs.slice(0,14)).map(a=>`<span class="chip ${liveActs.has(a)?'live':''}">${a}</span>`).join('');
  const n = S.connected.length;

  return topbar(1)+`<main><div class="wide">
    <h1>Connect the tools you already use</h1>
    <p class="sub">Memberful handles payments and access, then keeps your other tools in sync. Connect at least one to finish creating your account. You can add more anytime.</p>
    <section class="panel">
      <div class="plist">
        <div class="ptop"><div class="search">${ICON.search}<input class="input" id="q" placeholder="Search ${Object.keys(APPS).length} integrations" value="${esc(S.q)}" autocomplete="off"></div></div>
        <div class="scroll">${list}</div>
        <div class="pfoot"><span class="meta">${n?`${n} connected`:'Connect at least one to continue'}</span>
          <button class="btn inline" id="go-int" type="button" ${n?'':'disabled'}>Create account</button></div>
      </div>
      <div class="pvis" aria-hidden="true"><div class="cloud">${cloud}</div><div class="orbit"><div class="hub">M</div>${sats}</div></div>
    </section>
  </div></main>`;
}

function vReady(){
  const s = seg();
  const first = (S.name.trim().split(/\s+/)[0]) || '';
  const hasPay = S.connected.includes('stripe');
  const rows = [[hasPay?'Payments connected':'Connect Stripe to get paid', hasPay?'You can accept payments right away':'Takes about two minutes', hasPay]]
    .concat(s.next.map(n=>[n[0],n[1],false]))
    .map((r,i)=>`<div class="step ${r[2]?'ok':''}"><span class="num">${r[2]?ICON.check:i+1}</span><span><div class="st">${r[0]}</div><div class="sd">${r[1]}</div></span><span class="go">${r[2]?'Done':'Start'}</span></div>`).join('');
  const pills = S.connected.map(id=>`<span class="pill">${logo(id)}${APPS[id].name}</span>`).join('');
  return topbar(2)+`<main><div class="ready">
    <h1>Your account is ready${first?', '+esc(first):''}!</h1>
    <p class="sub">Here’s the fastest path to your first paying member.</p>
    ${pills?`<div class="connected">${pills}</div>`:''}
    <div class="steps"><div class="sh"><span>Your launch checklist</span><span>${hasPay?1:0} of ${s.next.length+1}</span></div>${rows}</div>
    <div class="center"><button class="btn inline" type="button" id="go-dash">Go to dashboard</button></div>
    <p class="support">Questions? Our team is here Monday to Friday, 9am–5pm EST.</p>
  </div></main>`;
}

function vModal(){
  if(!S.modal) return '';
  const a = APPS[S.modal], c = S.connected.includes(S.modal);
  return `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mhead">${logo(S.modal)}<div><h2 id="mt">${a.name}</h2><p>${a.desc}</p></div><button class="x" type="button" id="mx" aria-label="Close">${ICON.x}</button></div>
    <div class="mbody"><div><h3>What it does</h3><ul>${a.ex.map(e=>`<li>${ICON.tick}<span>${e}</span></li>`).join('')}</ul></div>
      <div><h3>Actions</h3><div class="chips">${a.act.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div></div>
    <div class="mfoot"><button class="btn" type="button" id="mconnect" ${S.connecting?'disabled':''}>${c?'Disconnect':S.connecting?'<span class="spinner"></span>Connecting…':'Connect '+a.name}</button></div>
  </div></div>`;
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=ICON.check+'<span>'+esc(msg)+'</span>';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

function render(){
  document.body.classList.toggle('ground', S.screen==='signup');
  const v = {signup:vSignup,segment:vSegment,integrations:vIntegrations}[S.screen]();
  $('#app').innerHTML = v + vModal();
  $('#jump').innerHTML = ORDER.map(k=>`<button type="button" data-jump="${k}" class="${k===S.screen?'cur':''}">${LABEL[k]}</button>`).join('');
  bind();
}

function bind(){
  const back = $('[data-back]'); if(back) back.onclick=()=>go(ORDER[Math.max(0,ORDER.indexOf(S.screen)-1)]);
  if(S.screen==='signup'){
    const sync=()=>{S.name=$('#name').value;S.email=$('#email').value;S.pw=$('#pw').value;S.terms=$('#terms').checked;
      $('#go-signup').disabled=!(S.name.trim()&&/\S+@\S+\.\S+/.test(S.email)&&S.pw.length>=8&&S.terms)};
    ['name','email','pw'].forEach(id=>$('#'+id).addEventListener('input',sync)); $('#terms').addEventListener('change',sync);
    $('#f-signup').addEventListener('submit',e=>{e.preventDefault(); if(!$('#go-signup').disabled) go('segment');});
  }
  if(S.screen==='segment'){
    document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{S.seg=b.dataset.seg;render();if(S.seg==='other')$('#other').focus();});
    const o=$('#other'); o.addEventListener('input',()=>{S.other=o.value;$('#go-seg').disabled=!segValid();});
    $('#go-seg').onclick=()=>{if(segValid())go('integrations');};
  }
  if(S.screen==='integrations'){
    const q=$('#q'); q.addEventListener('input',()=>{S.q=q.value;const pos=q.selectionStart;render();const nq=$('#q');nq.focus();nq.setSelectionRange(pos,pos);});
    document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{S.modal=b.dataset.app;render();});
    $('#go-int').onclick=()=>{if(S.connected.length)toast('Account created. Onboarding would start here.');};
  }
  if(S.modal){
    const close=()=>{S.modal=null;S.connecting=false;render();};
    $('#mx').onclick=close;
    $('#scrim').onclick=e=>{if(e.target.id==='scrim')close();};
    $('#mconnect').onclick=()=>{
      const id=S.modal;
      if(S.connected.includes(id)){S.connected=S.connected.filter(x=>x!==id);close();return;}
      S.connecting=true;render();
      setTimeout(()=>{S.connected.push(id);S.connecting=false;S.modal=null;render();toast(APPS[id].name+' connected');},1100);
    };
    $('#mconnect').focus();
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;S.connecting=false;render();}});
$('#jump').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b)go(b.dataset.jump);});
$('#fill').onclick=()=>{S.name='Jordan Rivera';S.email='jordan@fieldnotes.co';S.pw='samplepassword';S.terms=true;if(!S.seg)S.seg='community';render();};
$('#restart').onclick=()=>{Object.assign(S,{name:'',email:'',pw:'',terms:false,seg:null,other:'',connected:[],q:'',modal:null,connecting:false});go('signup');};
const h=(location.hash||'').slice(1); if(ORDER.includes(h)) S.screen=h;
render();
</script>

</body></html>
